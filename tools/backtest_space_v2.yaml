# Search around what runs live since 2026-10-05: setting A + vertical-pump
# filter (gainer.filters.max_rise_share_4h 0.8). Live values are in comments.
deposits: {start: 50, monthly: 50}

round1:
  single:
    # --- setting A's filters and limits: removed (0 / null) or moved
    gainer.filters.btc_min_change_24h_pct: [null, -1, -3, -5]           # live -2
    gainer.filters.min_price: [0, 0.0001, 0.01]                         # live 0.001
    gainer.limits.max_exposure_pct: [0, 30, 50]                         # live 20
    gainer.limits.drawdown_pause_pct: [0, 10, 30]                       # live 20
    gainer.exit.unarmed_max_hours: [0, 24, 36, 72, 96]                  # live 48
    # --- the vertical-pump filter
    gainer.filters.max_rise_share_4h: [0, 0.6, 0.65, 0.7, 0.9]          # live 0.8
    test.max_rise_share_1h: [0.5, 0.7]
    # --- ladder
    gainer.exit.ladder_first_pct: [5, 7.5, 15, 20, 30]                  # live 10
    gainer.exit.ladder_step_pct: [5, 7.5, 15, 20, 30]                   # live 10
    gainer.exit.ladder_mode: [trail]                                    # live lock
    # --- take-profit
    gainer.exit.target_pct: [0, 30, 50, 75, 125, 150, 200, 300]         # live 95
    # --- stop
    gainer.exit.stop_pct: [15, 20, 25, 35, 40, 50]                      # live 30
    # --- suggested: skip a leader whose dump has already started
    test.max_below_high_pct: [8, 12, 20]

  bundles:
    ladder_pair:
      - {gainer.exit.ladder_first_pct: 5, gainer.exit.ladder_step_pct: 5}
      - {gainer.exit.ladder_first_pct: 15, gainer.exit.ladder_step_pct: 15}
      - {gainer.exit.ladder_first_pct: 20, gainer.exit.ladder_step_pct: 20}
      - {gainer.exit.ladder_first_pct: 10, gainer.exit.ladder_step_pct: 20}
      - {gainer.exit.ladder_first_pct: 20, gainer.exit.ladder_step_pct: 10}
    no_ladder:
      - {gainer.exit.ladder_enabled: false}
    atr_stop:
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 2}
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 3}
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 4}
    partial_take:
      - {gainer.exit.partial_take_pct: 30, gainer.exit.partial_fraction: 0.5}
      - {gainer.exit.partial_take_pct: 50, gainer.exit.partial_fraction: 0.5}
      - {gainer.exit.partial_take_pct: 75, gainer.exit.partial_fraction: 0.5}
    # suggested: free the slot from a loser held 24h+ for a new leader
    swap_losers:
      - {test.when_full: replace_losing, test.replace_min_hold_hours: 24}
      - {gainer.limits.max_exposure_pct: 0, test.when_full: replace_losing, test.replace_min_hold_hours: 24}

round2:
  keep_per_setting: 2
  max_runs: 1500
