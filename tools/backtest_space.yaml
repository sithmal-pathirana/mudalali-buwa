# The search space for `python3 -m tools.backtest_gainer search`.
#
# Round 1 replays the live config.yaml with ONE setting changed, for every
# value below. Round 2 replays every combination, across settings, of the
# round-1 values that beat live in both years (each setting may also stay at
# its live value). Live values are listed in comments; they are always the
# baseline, so they need not be repeated here.

deposits: {start: 50, monthly: 50}

round1:
  # One setting per line, each value tried on its own.
  single:
    # --- board: which coin is the leader
    gainer.board.min_quote_volume: [5000000, 20000000, 50000000, 100000000]   # live 10M
    gainer.board.leader_check_minutes: [15, 30, 60]                           # live 5

    # --- entry: when the leader is bought, and how much
    gainer.entry.confirm_minutes: [10, 15, 30, 60]                            # live 0
    gainer.entry.buy_only_if_rising: [true]                                   # live false
    gainer.entry.rebuy_cooldown_minutes: [0, 60, 360, 720, 1440]              # live 180
    gainer.entry.max_positions: [1, 2, 3, 4, 6, 8, 10]                        # live 5
    gainer.entry.notional_pct_of_equity: [5, 7.5, 12.5, 15, 20]               # live 10

    # --- exit: when a position is sold
    gainer.exit.target_pct: [0, 30, 50, 75, 125, 150, 200]                    # live 95
    gainer.exit.stop_pct: [10, 15, 20, 25, 35, 40, 50]                        # live 30
    gainer.exit.ladder_first_pct: [5, 7.5, 15, 20, 30]                        # live 10
    gainer.exit.ladder_step_pct: [5, 7.5, 15, 20, 30]                         # live 10
    gainer.exit.ladder_mode: [trail]                                          # live lock
    gainer.exit.unarmed_max_hours: [0, 12, 24, 48, 96, 168]                   # live 72

    # --- filters: leaders skipped, as a trader would
    gainer.filters.max_rsi_1h: [70, 75, 80, 85, 90, 95]                       # live off
    gainer.filters.min_listing_age_days: [1, 3, 7, 14, 30]                    # live off
    gainer.filters.btc_min_change_24h_pct: [-5, -3, -2, -1, 0]                # live off
    gainer.filters.btc_max_drop_1h_pct: [0.5, 1, 1.5, 2, 3]                   # live off
    gainer.filters.min_price: [0.0001, 0.001, 0.01, 0.1]                      # live off

    # --- limits: when no new trade is opened
    gainer.limits.max_new_trades_per_day: [2, 3, 5, 8, 10]                    # live off
    gainer.limits.pause_after_losses: [2, 3, 4, 5, 8]                         # live off
    gainer.limits.max_exposure_pct: [20, 30, 40]                              # live off
    gainer.limits.daily_loss_limit_pct: [3, 5, 10, 15]                        # live off
    gainer.limits.drawdown_pause_pct: [15, 20, 30, 50]                        # live off

    # --- sweep: money moved to the Funding wallet
    gainer.sweep.pct: [10, 15, 35, 50, 75]                                    # live 25
    gainer.sweep.start_when_equity_usdt: [100, 200, 300, 600]                 # live 0
    gainer.sweep.principal_trigger_x: [1.5, 2, 3]                             # live 2.5

  # Settings that only mean something together; each set is tried on its own,
  # and each named group counts as one setting in round 2.
  bundles:
    climber:
      - {gainer.board.rank_by: climb, gainer.board.climb_minutes: 30}
      - {gainer.board.rank_by: climb, gainer.board.climb_minutes: 60}
      - {gainer.board.rank_by: climb, gainer.board.climb_minutes: 240}
      - {gainer.board.rank_by: climb, gainer.board.climb_minutes: 60, gainer.board.climb_volume_surge_x: 3}
    atr_stop:
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 2}
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 3}
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 4}
      - {gainer.exit.stop_mode: atr, gainer.exit.atr_stop_mult: 5}
    partial_take:
      - {gainer.exit.partial_take_pct: 20, gainer.exit.partial_fraction: 0.5}
      - {gainer.exit.partial_take_pct: 30, gainer.exit.partial_fraction: 0.5}
      - {gainer.exit.partial_take_pct: 50, gainer.exit.partial_fraction: 0.5}
      - {gainer.exit.partial_take_pct: 50, gainer.exit.partial_fraction: 0.33}
      - {gainer.exit.partial_take_pct: 75, gainer.exit.partial_fraction: 0.5}
    sell_losers_on_new_leader:
      - {gainer.exit.on_new_leader: close_if_losing, gainer.exit.min_hold_minutes: 15}
      - {gainer.exit.on_new_leader: close_if_losing, gainer.exit.min_hold_minutes: 60}
      - {gainer.exit.on_new_leader: close_if_losing, gainer.exit.min_hold_minutes: 240}
    sizing:
      - {gainer.sizing.mode: volatility}
      - {gainer.sizing.mode: conviction}
    no_funding_sweep:
      - {gainer.sweep.enabled: false}

round2:
  # Best values per setting carried in (fewer if the grid would pass max_runs).
  keep_per_setting: 2
  # About 1 second per run: 3000 is roughly an hour.
  max_runs: 3000
